<section class="reliable-section" id="reliable-care">
  <!-- Subtle fluid wave gradient swoosh in background -->
  <div class="reliable-bg-swoosh" aria-hidden="true">
    <svg viewBox="0 0 1440 280" fill="none" preserveAspectRatio="none">
      <path d="M-50 210 C 250 280, 550 140, 1490 200 L 1490 280 L -50 280 Z" fill="rgba(16, 185, 129, 0.035)"/>
      <path d="M-50 230 C 320 270, 720 170, 1490 220" stroke="rgba(16, 185, 129, 0.09)" stroke-width="2"/>
    </svg>
  </div>

  <div class="container">
    <div class="reliable-grid">
      <!-- Left Column: Title & Accent Line -->
      <div class="reliable-title-col">
        <h2 class="reliable-title">
          <span class="title-dark">Reliable Results.</span>
          <span class="title-green">Better Care.</span>
        </h2>
        <div class="reliable-accent-bar"></div>
      </div>

      <!-- Right Column: 5 Connected Step Cards with Wave Thread -->
      <div class="reliable-steps-col">
        <!-- Connecting undulating line with node dots matching reference image -->
        <svg class="connecting-curve-svg" viewBox="0 0 1000 120" fill="none" preserveAspectRatio="none" aria-hidden="true">
          <!-- Continuous smooth wave connecting all 5 badges -->
          <path class="animated-path" d="M 0 66 C 35 66, 65 48, 100 48 C 135 48, 165 72, 205 72 C 245 72, 265 48, 305 48 C 345 48, 365 72, 405 72 C 445 72, 465 48, 505 48 C 545 48, 565 72, 605 72 C 645 72, 665 48, 705 48 C 745 48, 765 72, 805 72 C 845 72, 865 48, 905 48 C 935 48, 960 66, 985 64 C 1005 60, 1020 45, 1045 28" stroke="rgba(16, 110, 75, 0.32)" stroke-width="2.5" stroke-linecap="round"/>
          
          <!-- Node Dots on the dips and entries/exits like in reference -->
          <circle cx="20" cy="66" r="3.5" fill="#1b7252" class="connector-node"/>
          <circle cx="205" cy="72" r="3.8" fill="#1b7252" class="connector-node"/>
          <circle cx="405" cy="72" r="3.8" fill="#1b7252" class="connector-node"/>
          <circle cx="605" cy="72" r="3.8" fill="#1b7252" class="connector-node"/>
          <circle cx="805" cy="72" r="3.8" fill="#1b7252" class="connector-node"/>
          <circle cx="985" cy="64" r="3.5" fill="#1b7252" class="connector-node"/>
        </svg>

        <div class="steps-row">
          <!-- Step 1: Quality Assurance (Microscope) -->
          <div class="step-card" id="step-quality">
            <div class="step-card-box">
              <div class="step-badge-outer">
                <div class="step-badge-crescent"></div>
                <div class="step-badge-disc">
                  <svg class="step-svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 18h8"/>
                    <path d="M3 21h18"/>
                    <path d="M14 21a7 7 0 0 0 0-14h-1"/>
                    <path d="M9 14h2"/>
                    <path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2z"/>
                    <path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/>
                  </svg>
                </div>
              </div>
              <div class="step-label">
                <span class="step-l1">Quality</span>
                <span class="step-l2">Assurance</span>
              </div>
            </div>
          </div>

          <!-- Step 2: Modern Technology (Microchip / CPU) -->
          <div class="step-card" id="step-tech">
            <div class="step-card-box">
              <div class="step-badge-outer">
                <div class="step-badge-crescent"></div>
                <div class="step-badge-disc">
                  <svg class="step-svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <rect x="9" y="9" width="6" height="6"/>
                    <line x1="9" y1="1" x2="9" y2="4"/>
                    <line x1="15" y1="1" x2="15" y2="4"/>
                    <line x1="9" y1="20" x2="9" y2="23"/>
                    <line x1="15" y1="20" x2="15" y2="23"/>
                    <line x1="20" y1="9" x2="23" y2="9"/>
                    <line x1="20" y1="14" x2="23" y2="14"/>
                    <line x1="1" y1="9" x2="4" y2="9"/>
                    <line x1="1" y1="14" x2="4" y2="14"/>
                  </svg>
                </div>
              </div>
              <div class="step-label">
                <span class="step-l1">Modern</span>
                <span class="step-l2">Technology</span>
              </div>
            </div>
          </div>

          <!-- Step 3: Experienced Team (3 People) -->
          <div class="step-card" id="step-team">
            <div class="step-card-box">
              <div class="step-badge-outer">
                <div class="step-badge-crescent"></div>
                <div class="step-badge-disc">
                  <svg class="step-svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="7" r="3.5"/>
                    <path d="M6 19v-1a4 4 0 0 1 8 0v1"/>
                    <circle cx="4.5" cy="9.5" r="2.5"/>
                    <path d="M1.5 19v-.8a3 3 0 0 1 3-3"/>
                    <circle cx="19.5" cy="9.5" r="2.5"/>
                    <path d="M22.5 19v-.8a3 3 0 0 0-3-3"/>
                  </svg>
                </div>
              </div>
              <div class="step-label">
                <span class="step-l1">Experienced</span>
                <span class="step-l2">Team</span>
              </div>
            </div>
          </div>

          <!-- Step 4: Timely Reporting (Clock 10:10) -->
          <div class="step-card" id="step-reporting">
            <div class="step-card-box">
              <div class="step-badge-outer">
                <div class="step-badge-crescent"></div>
                <div class="step-badge-disc">
                  <svg class="step-svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9.5"/>
                    <polyline points="12 6.5 12 12 16 12"/>
                  </svg>
                </div>
              </div>
              <div class="step-label">
                <span class="step-l1">Timely</span>
                <span class="step-l2">Reporting</span>
              </div>
            </div>
          </div>

          <!-- Step 5: Patient Support (Headset) -->
          <div class="step-card" id="step-support">
            <div class="step-card-box">
              <div class="step-badge-outer">
                <div class="step-badge-crescent"></div>
                <div class="step-badge-disc">
                  <svg class="step-svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 13v-3a9 9 0 0 1 18 0v3"/>
                    <path d="M21 15a2 2 0 0 1-2 2h-1a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1z"/>
                    <path d="M3 15a2 2 0 0 0 2 2h1a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/>
                  </svg>
                </div>
              </div>
              <div class="step-label">
                <span class="step-l1">Patient</span>
                <span class="step-l2">Support</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
