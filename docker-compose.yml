services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hameed_latif_backend
    ports:
      - "5153:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY}}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY}}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hameed_latif_frontend
    ports:
      - "4100:80"
    depends_on:
      - backend
    restart: unless-stopped
